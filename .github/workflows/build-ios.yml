name: Build & Test iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "EmvCardReaderIOS/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: EmvCardReaderIOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          echo "Using: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devicetypes

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EmvCardReader.xcodeproj \
            -scheme EmvCardReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          xcodebuild test \
            -project EmvCardReader.xcodeproj \
            -scheme EmvCardReader \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcpretty --test || (echo "xcodebuild test failed" && exit 1)

      - name: Build unsigned .app for device (for sideloading)
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild build \
            -project EmvCardReader.xcodeproj \
            -scheme EmvCardReader \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | xcpretty || true
          find build/Build/Products -maxdepth 2 -type d -name "*.app"
          APP=$(find build/Build/Products -maxdepth 2 -type d -name "*.app" | head -n1)
          echo "APP=$APP"
          test -d "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qr ../EmvCardReader-unsigned.ipa Payload

      - name: Upload unsigned IPA (sideload with AltStore/Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: EmvCardReader-unsigned-ipa
          path: EmvCardReaderIOS/EmvCardReader-unsigned.ipa

      - name: Upload generated project (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: EmvCardReaderIOS/EmvCardReader.xcodeproj
