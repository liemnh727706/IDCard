name: Build & Test iOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "EmvCardReaderIOS/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: EmvCardReaderIOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devicetypes

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EmvCardReader.xcodeproj \
            -scheme EmvCardReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          xcodebuild test \
            -project EmvCardReader.xcodeproj \
            -scheme EmvCardReader \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcpretty --test || (echo "xcodebuild test failed" && exit 1)

      - name: Upload generated project (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: EmvCardReaderIOS/EmvCardReader.xcodeproj
