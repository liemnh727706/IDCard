name: Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "EmvCardReader/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmvCardReader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emv-chip-reader-debug-apk
          path: EmvCardReader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
